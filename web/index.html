<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobapplier</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a3441;
    --text:#e6edf3; --dim:#8b949e; --accent:#3b82f6; --ok:#22c55e;
    --warn:#f59e0b; --err:#ef4444; --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;
         border-bottom:1px solid var(--line);background:var(--panel);
         position:sticky;top:0;z-index:10;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:12px}
  .grow{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--panel2);
         color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;
         font-weight:550;transition:.12s}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ok{background:var(--ok);border-color:var(--ok);color:#04140a}
  button.danger{background:transparent;border-color:var(--err);color:var(--err)}
  input,select{font:inherit;background:var(--bg);color:var(--text);
        border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  main{display:grid;grid-template-columns:1fr 400px;gap:18px;padding:18px 22px;
       align-items:start}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);overflow:hidden}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;
           color:var(--dim);margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
  .pad{padding:16px}
  .statusline{display:flex;align-items:center;gap:10px;padding:12px 16px;
              border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.run{background:var(--ok);animation:pulse 1.4s infinite}
  .dot.wait{background:var(--warn);animation:pulse 1.4s infinite}
  .dot.err{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .tally{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;
        padding:4px 11px;font-size:12px}
  .chip b{color:var(--text)}
  .chip.ok b{color:var(--ok)} .chip.warn b{color:var(--warn)} .chip.err b{color:var(--err)}
  #log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
       max-height:340px;overflow:auto;padding:10px 16px}
  #log div{padding:1px 0;white-space:pre-wrap;word-break:break-word}
  .l-info{color:var(--text)} .l-dim{color:var(--dim)} .l-ok{color:var(--ok)}
  .l-warn{color:var(--warn)} .l-error{color:var(--err)}
  table{width:100%;border-collapse:collapse}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  tr:last-child td{border-bottom:none}
  td.k{color:var(--dim);width:44%;word-break:break-word}
  td.v{font-weight:550;word-break:break-word}
  .flag td.v{color:var(--warn)}
  .empty{padding:34px 16px;text-align:center;color:var(--dim)}
  .job-title{font-size:16px;font-weight:650;margin:0 0 4px}
  .job-meta{color:var(--dim);font-size:12.5px;margin-bottom:12px}
  .job-meta a{color:var(--accent);text-decoration:none}
  .warnbox{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.35);
           border-radius:8px;padding:10px 12px;margin:12px 0;font-size:12.5px;color:var(--warn)}
  .actions{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
  .actions button{flex:1;padding:11px}
  .note{color:var(--dim);font-size:11.5px;padding:0 16px 14px}
  a.shot{color:var(--accent);font-size:12px;text-decoration:none}
</style>
</head>
<body>

<header>
  <h1>Jobapplier</h1>
  <span class="sub">one company at a time · nothing submits without your click</span>
  <span class="grow"></span>
  <input id="company" placeholder="all companies" size="14" title="Limit to companies matching this text">
  <select id="perco" title="Max applications per company">
    <option value="1">1 job/co</option>
    <option value="3" selected>3 jobs/co</option>
    <option value="5">5 jobs/co</option>
  </select>
  <label class="sub" style="display:flex;align-items:center;gap:5px">
    <input type="checkbox" id="dry" style="width:auto"> dry run
  </label>
  <button id="start" class="primary">Start</button>
  <button id="stop" class="danger" disabled>Stop</button>
</header>

<main>
  <div style="display:flex;flex-direction:column;gap:18px">

    <section class="card">
      <div class="statusline">
        <span class="dot" id="dot"></span>
        <b id="phase">Idle</b>
        <span class="sub" id="current"></span>
        <div class="bar"><i id="bar"></i></div>
        <span class="sub" id="progress">0 / 0</span>
      </div>
      <div class="tally" id="tally"></div>
    </section>

    <section class="card" id="pendingCard">
      <h2>Awaiting your decision</h2>
      <div class="empty" id="pendingEmpty">
        Nothing waiting. Press <b>Start</b> and the first filled application
        will appear here for review.
      </div>
      <div id="pendingBody" style="display:none">
        <div class="pad" style="padding-bottom:0">
          <p class="job-title" id="pTitle"></p>
          <div class="job-meta" id="pMeta"></div>
          <div id="pWarn"></div>
        </div>
        <table id="pFields"></table>
        <div class="actions">
          <button class="ok" id="submitBtn">Submit application</button>
          <button id="skipBtn">Skip</button>
        </div>
        <div class="note" id="pNote"></div>
      </div>
    </section>

  </div>

  <section class="card">
    <h2>Activity</h2>
    <div id="log"><div class="l-dim">Waiting to start…</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let pendingKey = null, logLen = 0, busy = false;

const PHASES = {
  idle:'Idle', resolving:'Resolving portals', company:'Working',
  awaiting:'Waiting on you', done:'Finished', error:'Error'
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}

function renderTally(t, counts) {
  const items = [
    ['companies', t.companies_done, ''],
    ['found', t.jobs_found, ''],
    ['filled', t.filled, ''],
    ['submitted', t.submitted, 'ok'],
    ['skipped', t.skipped, ''],
    ['needs login', t.needs_login, 'warn'],
    ['failed', t.failed, 'err'],
  ];
  $('tally').innerHTML = items
    .map(([k, v, cls]) => `<span class="chip ${v ? cls : ''}">${k} <b>${v || 0}</b></span>`)
    .join('');
}

function renderPending(p) {
  if (!p) {
    pendingKey = null;
    $('pendingBody').style.display = 'none';
    $('pendingEmpty').style.display = '';
    return;
  }
  if (p.key === pendingKey) return;      // already rendered
  pendingKey = p.key;
  busy = false;

  $('pendingEmpty').style.display = 'none';
  $('pendingBody').style.display = '';
  $('pTitle').textContent = p.title;
  $('pMeta').innerHTML =
    `${p.company} · ${p.location || 'location n/a'} · match ${p.score.toFixed(2)}` +
    ` · <a href="${p.url}" target="_blank" rel="noreferrer">open posting ↗</a>` +
    (p.screenshot ? ` · <a class="shot" target="_blank" rel="noreferrer"
        href="/api/screenshot?path=${encodeURIComponent(p.screenshot)}">screenshot ↗</a>` : '');

  $('pWarn').innerHTML = (p.unanswered && p.unanswered.length)
    ? `<div class="warnbox"><b>${p.unanswered.length} field(s) left blank</b> — no profile
       answer matched. Check the browser window before submitting:<br>
       ${p.unanswered.slice(0, 8).map(u => '· ' + u).join('<br>')}</div>`
    : '';

  // Work-auth and EEO answers are highlighted: they're the ones worth reading.
  $('pFields').innerHTML = (p.fields || []).map(f => {
    const flag = /^(work_auth|eeo)/.test(f.source) ? ' class="flag"' : '';
    return `<tr${flag}><td class="k">${esc(f.label)}</td><td class="v">${esc(f.value)}</td></tr>`;
  }).join('');

  $('pNote').textContent = p.note || '';
  $('submitBtn').disabled = $('skipBtn').disabled = false;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderLog(log) {
  if (log.length === logLen) return;
  const el = $('log');
  if (log.length < logLen) { el.innerHTML = ''; logLen = 0; }
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  for (const e of log.slice(logLen)) {
    const d = document.createElement('div');
    d.className = 'l-' + e.level;
    d.textContent = e.message;
    el.appendChild(d);
  }
  logLen = log.length;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

async function poll() {
  try {
    const s = await api('/api/state');

    $('phase').textContent = PHASES[s.phase] || s.phase;
    $('current').textContent = s.current_company
      ? '· ' + s.current_company + (s.stopping ? ' (stopping…)' : '') : '';

    const dot = $('dot');
    dot.className = 'dot' + (s.phase === 'awaiting' ? ' wait'
      : s.phase === 'error' ? ' err' : s.running ? ' run' : '');

    const pct = s.company_total ? (s.company_index / s.company_total) * 100 : 0;
    $('bar').style.width = pct + '%';
    $('progress').textContent = `${s.company_index} / ${s.company_total}`;

    renderTally(s.tally, s.counts);
    renderLog(s.log || []);
    renderPending(s.pending);

    $('start').disabled = s.running;
    $('stop').disabled = !s.running;
    if (s.error) $('phase').textContent = 'Error';
  } catch (e) {
    $('phase').textContent = 'Server unreachable';
    $('dot').className = 'dot err';
  }
}

$('start').onclick = async () => {
  $('start').disabled = true;
  try {
    await api('/api/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        company: $('company').value.trim(),
        max_jobs_per_company: +$('perco').value,
        dry_run: $('dry').checked,
      }),
    });
    logLen = 0; $('log').innerHTML = '';
  } catch (e) {
    alert('Could not start: ' + e.message);
    $('start').disabled = false;
  }
  poll();
};

$('stop').onclick = () => api('/api/stop', {method: 'POST'}).then(poll);

async function decide(action) {
  if (!pendingKey || busy) return;
  busy = true;
  $('submitBtn').disabled = $('skipBtn').disabled = true;
  try {
    await api('/api/decision', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: pendingKey, action}),
    });
    pendingKey = null;
    $('pendingBody').style.display = 'none';
    $('pendingEmpty').style.display = '';
  } catch (e) {
    alert(e.message);
    busy = false;
    $('submitBtn').disabled = $('skipBtn').disabled = false;
  }
  poll();
}

$('submitBtn').onclick = () => decide('submit');
$('skipBtn').onclick = () => decide('skip');

poll();
setInterval(poll, 1200);
</script>
</body>
</html>
